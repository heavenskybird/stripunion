name: Editorial producer scheduler

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/control-plane/editorial-producer-kick.json'
  workflow_run:
    workflows:
      - 'Native social outbox'
      - 'Ecosystem public health'
      - 'Editorial production snapshot'
      - 'Control plane authority promotion'
      - 'Telegram evergreen distribution'
      - 'Visual QA'
    types: [completed]

permissions:
  contents: write
  actions: write

# Coalesce wakeups without killing the writer. Pending replacement is safe: every
# admitted job evaluates durable cadence, rather than depending on a particular cron.
concurrency:
  group: editorial-producer-scheduler-r1
  cancel-in-progress: false

jobs:
  produce-if-due:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event != 'pull_request'))
    uses: ./.github/workflows/editorial-hourly-producer.yml
    secrets: inherit
