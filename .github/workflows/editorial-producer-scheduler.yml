name: Editorial producer scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/control-plane/editorial-producer-kick.json'
  workflow_run:
    workflows:
      - 'Native social outbox'
      - 'Ecosystem public health'
      - 'Editorial production snapshot'
      - 'Control plane authority promotion'
      - 'Telegram evergreen distribution'
      - 'Visual QA'
      - 'Build'
      - 'Hostinger Read-only Acceptance'
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: editorial-producer-scheduler
  cancel-in-progress: true

jobs:
  dispatch-if-due:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch canonical Producer only when due
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh workflow enable editorial-hourly-producer.yml || true

          runs="$(gh run list \
            --workflow editorial-hourly-producer.yml \
            --limit 20 \
            --json databaseId,status,conclusion,createdAt,event,url)"

          decision="$(RUNS_JSON="$runs" node - <<'NODE'
          const runs = JSON.parse(process.env.RUNS_JSON || '[]');
          const now = Date.now();
          const activeStatuses = new Set(['queued', 'in_progress', 'waiting', 'requested', 'pending']);
          const active = runs
            .filter((run) => activeStatuses.has(run.status))
            .sort((a, b) => Date.parse(b.createdAt || 0) - Date.parse(a.createdAt || 0))[0] || null;

          if (active) {
            console.log(JSON.stringify({ action: 'skip-active', active }));
            process.exit(0);
          }

          const latest = runs
            .filter((run) => run.createdAt)
            .sort((a, b) => Date.parse(b.createdAt) - Date.parse(a.createdAt))[0] || null;

          if (!latest) {
            console.log(JSON.stringify({ action: 'dispatch', reason: 'no-prior-run' }));
            process.exit(0);
          }

          const ageMinutes = (now - Date.parse(latest.createdAt)) / 60000;
          const failed = ['failure', 'cancelled', 'timed_out', 'action_required', 'startup_failure']
            .includes(latest.conclusion);

          if (failed && ageMinutes >= 10) {
            console.log(JSON.stringify({
              action: 'dispatch',
              reason: 'retry-completed-failure',
              ageMinutes: Number(ageMinutes.toFixed(1)),
              latest
            }));
            process.exit(0);
          }

          if (failed) {
            console.log(JSON.stringify({
              action: 'skip-retry-backoff',
              ageMinutes: Number(ageMinutes.toFixed(1)),
              latest
            }));
            process.exit(0);
          }

          if (ageMinutes >= 58) {
            console.log(JSON.stringify({
              action: 'dispatch',
              reason: 'hourly-cadence-due',
              ageMinutes: Number(ageMinutes.toFixed(1)),
              latest
            }));
          } else {
            console.log(JSON.stringify({
              action: 'skip-fresh',
              ageMinutes: Number(ageMinutes.toFixed(1)),
              latest
            }));
          }
          NODE
          )"

          echo "EDITORIAL_PRODUCER_SCHEDULER $decision"

          action="$(node -e 'const d=JSON.parse(process.argv[1]); process.stdout.write(d.action)' "$decision")"
          if [[ "$action" == "dispatch" ]]; then
            gh workflow run editorial-hourly-producer.yml --ref main
            echo "EDITORIAL_PRODUCER_DISPATCH_REQUESTED"
          fi
