name: Commercial conversion read-only evidence
on:
  push:
    branches: [codex/commercial-exits-20261115]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: commercial-conversion-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --test scripts/test/affiliate-coverage-audit.test.mjs scripts/test/commercial-coverage-priority.test.mjs
      - run: PUBLIC_ALLOW_INDEXING=true npm run build && npm run check:prod-seo
      - name: Rendered audit and source-dated GSC commercial ranking
        run: node scripts/commercial-coverage-priority.mjs
      - name: Verify three existing real production CTAs without conversions
        if: always()
        run: node scripts/commercial-live-readonly.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: commercial-conversion-evidence-${{ github.run_id }}
          path: artifacts/commercial
          retention-days: 30
