name: Native social outbox

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches: [main, codex/recovery-integration-20261111]
    paths:
      - 'ops/editorial/publication-ledger/astro/*.json'
      - 'ops/control-plane/social-outbox-kick.json'
      - '.github/workflows/social-outbox.yml'
      - 'scripts/social-outbox-admission.mjs'

permissions:
  contents: write

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'native-social-outbox' || 'native-social-outbox-paused-preflight' }}
  cancel-in-progress: false

jobs:
  reconcile-and-deliver:
    # The integration branch may exercise only the explicitly paused path.
    if: >-
      github.repository == 'heavenskybird/stripunion' &&
      (github.ref == 'refs/heads/main' ||
       (github.ref == 'refs/heads/codex/recovery-integration-20261111' &&
        vars.SOCIAL_OUTBOX_SEND_ENABLED == 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical main or isolated paused preflight
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || github.sha }}
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Respect operator sending switch
        id: operator
        env:
          SOCIAL_OUTBOX_SEND_ENABLED: ${{ vars.SOCIAL_OUTBOX_SEND_ENABLED || 'false' }}
          SOCIAL_OUTBOX_X_SEND_ENABLED: ${{ vars.SOCIAL_OUTBOX_X_SEND_ENABLED || 'false' }}
          SOCIAL_OUTBOX_TELEGRAM_SEND_ENABLED: ${{ vars.SOCIAL_OUTBOX_TELEGRAM_SEND_ENABLED || 'false' }}
          SOCIAL_OUTBOX_SINGLE_WRITER_ENABLED: ${{ vars.SOCIAL_OUTBOX_SINGLE_WRITER_ENABLED || 'false' }}
        run: node scripts/social-outbox-admission.mjs

      - name: Verify accepted isolated runtime before any event synchronization
        if: steps.operator.outputs.send_enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOCIAL_OUTBOX_SEND_ENABLED: ${{ vars.SOCIAL_OUTBOX_SEND_ENABLED || 'false' }}
          SOCIAL_OUTBOX_X_SEND_ENABLED: ${{ vars.SOCIAL_OUTBOX_X_SEND_ENABLED || 'false' }}
          SOCIAL_OUTBOX_TELEGRAM_SEND_ENABLED: ${{ vars.SOCIAL_OUTBOX_TELEGRAM_SEND_ENABLED || 'false' }}
          SOCIAL_OUTBOX_SINGLE_WRITER_ENABLED: ${{ vars.SOCIAL_OUTBOX_SINGLE_WRITER_ENABLED || 'false' }}
        run: node scripts/social-outbox-runtime-preflight.mjs

      - name: Install dependencies
        if: steps.operator.outputs.send_enabled == 'true'
        run: npm install

      - name: Verify exact Telegram channel identity and bot permission
        if: steps.operator.outputs.send_enabled == 'true' && steps.operator.outputs.telegram_send_enabled == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
        run: node scripts/telegram-readiness-readonly.mjs

      - name: Plan one distinct demand-backed Telegram post
        if: steps.operator.outputs.send_enabled == 'true' && steps.operator.outputs.telegram_send_enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/telegram-autonomy-plan.mjs

      - name: Sync publication ledger into native outbox
        if: steps.operator.outputs.send_enabled == 'true'
        run: npm run social:outbox:sync

      - name: Reconcile historical Buffer deliveries
        if: steps.operator.outputs.send_enabled == 'true' && steps.operator.outputs.x_send_enabled == 'true'
        id: reconcile_buffer
        continue-on-error: true
        env:
          SOCIAL_OUTBOX_SINGLE_WRITER_ENABLED: ${{ vars.SOCIAL_OUTBOX_SINGLE_WRITER_ENABLED || 'false' }}
          SOCIAL_OUTBOX_SEND_ENABLED: ${{ vars.SOCIAL_OUTBOX_SEND_ENABLED || 'false' }}
          SOCIAL_OUTBOX_X_SEND_ENABLED: ${{ vars.SOCIAL_OUTBOX_X_SEND_ENABLED || 'false' }}
          SOCIAL_OUTBOX_TELEGRAM_SEND_ENABLED: ${{ vars.SOCIAL_OUTBOX_TELEGRAM_SEND_ENABLED || 'false' }}
          GH_TOKEN: ${{ github.token }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
        run: npm run social:outbox:reconcile:buffer

      - name: Process safe pending deliveries
        if: steps.operator.outputs.send_enabled == 'true'
        env:
          SOCIAL_OUTBOX_SINGLE_WRITER_ENABLED: ${{ vars.SOCIAL_OUTBOX_SINGLE_WRITER_ENABLED || 'false' }}
          BUFFER_RECONCILIATION_OUTCOME: ${{ steps.reconcile_buffer.outcome }}
          GH_TOKEN: ${{ github.token }}
          SOCIAL_OUTBOX_SEND_ENABLED: ${{ vars.SOCIAL_OUTBOX_SEND_ENABLED || 'false' }}
          SOCIAL_OUTBOX_X_SEND_ENABLED: ${{ vars.SOCIAL_OUTBOX_X_SEND_ENABLED || 'false' }}
          SOCIAL_OUTBOX_TELEGRAM_SEND_ENABLED: ${{ vars.SOCIAL_OUTBOX_TELEGRAM_SEND_ENABLED || 'false' }}
          SOCIAL_OUTBOX_TRIAL_EVENT_KEY: ${{ vars.SOCIAL_OUTBOX_TRIAL_EVENT_KEY || '' }}
          SOCIAL_OUTBOX_BATCH_SIZE: ${{ vars.SOCIAL_OUTBOX_BATCH_SIZE || '1' }}
          TELEGRAM_AUTONOMY_ENABLED: 'true'
          SOCIAL_OUTBOX_TIMEZONE: Asia/Shanghai
          SOCIAL_OUTBOX_X_DAILY_CAP: ${{ vars.SOCIAL_OUTBOX_X_DAILY_CAP || '1' }}
          SOCIAL_OUTBOX_X_MIN_INTERVAL_MINUTES: '2880'
          SOCIAL_OUTBOX_TELEGRAM_DAILY_CAP: ${{ vars.SOCIAL_OUTBOX_TELEGRAM_DAILY_CAP || '3' }}
          BUFFER_API_KEY: ${{ steps.operator.outputs.x_send_enabled == 'true' && secrets.BUFFER_API_KEY || '' }}
          BUFFER_CHANNEL_ID: ${{ steps.operator.outputs.x_send_enabled == 'true' && vars.BUFFER_CHANNEL_ID || '' }}
          TELEGRAM_BOT_TOKEN: ${{ steps.operator.outputs.telegram_send_enabled == 'true' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHANNEL_ID: ${{ steps.operator.outputs.telegram_send_enabled == 'true' && vars.TELEGRAM_CHANNEL_ID || '' }}
        run: npm run social:outbox:worker

      - name: Report outbox state
        if: always() && steps.operator.outputs.send_enabled == 'true'
        run: npm run social:outbox:report

      - name: Persist native outbox state
        if: always() && steps.operator.outputs.send_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "stripunion-social-outbox"
          git config user.email "actions@users.noreply.github.com"
          git add ops/social-outbox/events

          if git diff --cached --quiet; then
            echo "No social outbox state changes."
            exit 0
          fi

          git commit -m "ops: reconcile native social outbox [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done

          echo "Failed to persist social outbox state after retries." >&2
          exit 1

      - name: Retain visible reconciliation failure after safe channel processing
        if: always() && steps.operator.outputs.send_enabled == 'true' && steps.operator.outputs.x_send_enabled == 'true' && steps.reconcile_buffer.outcome == 'failure'
        run: |
          echo "::error::Buffer reconciliation failed or is cooling down. X sends held; safe channel results were persisted."
          exit 1
