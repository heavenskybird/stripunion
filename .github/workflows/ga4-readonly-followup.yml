name: GA4 diagnostic read-only follow-up
on:
  push:
    branches: [codex/release-183-acceptance]
    paths: [.github/workflows/ga4-readonly-followup.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2ec003a6e6c93c300b49607c36d37406d29325ab
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate canonical-host and per-message UTM dimensions through official read-only API
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GA4_PROPERTY_ID: '530171093'
        run: |
          npm --prefix ops/seo-data-layer install
          npm --prefix ops/seo-data-layer run collect:ga4
          npm --prefix ops/seo-data-layer run collect:ga4-admin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ga4-readonly-followup-${{ github.run_id }}
          path: |
            ops/seo-data-layer/data/raw/**/ga4.json
            ops/seo-data-layer/data/raw/**/ga4-admin.json
          retention-days: 14
