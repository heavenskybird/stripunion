name: StripCash models API schema probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probe StripCash Models API schema
        env:
          STRIPCASH_MODELS_API_KEY: ${{ secrets.STRIPCASH_MODELS_API_KEY }}
        run: node ops/seo-data-layer/src/collectors/stripcash-models-schema-probe.mjs
