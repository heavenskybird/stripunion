name: Telegram Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/telegram-bootstrap.yml'
      - 'ops/seo-data-layer/src/distribution/telegram.mjs'

permissions:
  contents: read

concurrency:
  group: native-social-outbox
  cancel-in-progress: false

jobs:
  publish-first-telegram-message:
    if: vars.SOCIAL_LEGACY_REPLAY_ENABLED == 'true' && vars.SOCIAL_OUTBOX_SINGLE_WRITER_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish StripUnion welcome post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
          SOCIAL_EVENT_JSON: >-
            {"title":"StripUnion is live on Telegram","url":"https://blog.stripunion.com/best-cam-sites-to-watch-live-models-online/","excerpt":"Adult-platform reviews, comparisons, pricing guides and creator resources — with new discoveries and updates published throughout the week.","post_id":"telegram-bootstrap-2026-09-28","source":"telegram-bootstrap"}
        run: node ops/seo-data-layer/src/distribution/telegram.mjs