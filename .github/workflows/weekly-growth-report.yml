name: Weekly growth report

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/weekly-growth-report.yml
      - ops/seo-data-layer/src/reports/**
  schedule:
    - cron: '45 1 * * 1'

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate report
        working-directory: ops/seo-data-layer
        run: node src/reports/weekly.mjs

      - name: Persist report
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No report changes"
            exit 0
          fi
          git config user.name "stripunion-growth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ops/seo-data-layer/data/reports/
          git commit -m "report: weekly growth snapshot [skip ci]"
          git push
