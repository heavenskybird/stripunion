name: Weekly growth report

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: growth-report-persistence
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate report
        working-directory: ops/seo-data-layer
        env:
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
        run: node src/reports/weekly.mjs

      - name: Persist report
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No report changes"
            exit 0
          fi
          git config user.name "stripunion-growth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ops/seo-data-layer/data/reports/
          git commit -m "report: weekly growth snapshot [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              if [ "$attempt" -lt 3 ]; then sleep "$attempt"; fi
              continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$attempt"
            fi
          done
          echo "Could not persist weekly growth report after three fast-forward retries."
          exit 1
