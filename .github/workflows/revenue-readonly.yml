name: Revenue truth read-only acceptance
on:
  push:
    branches: [codex/revenue-truth-20261115]
    paths:
      - '.github/workflows/revenue-readonly.yml'
      - 'ops/growth/lib/revenue-*.mjs'
      - 'ops/growth/brain.mjs'
      - 'scripts/revenue-readonly-acceptance.mjs'
      - 'scripts/test/revenue-truth.test.mjs'
      - 'ops/seo-data-layer/src/collectors/stripcash.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: revenue-readonly-acceptance
  cancel-in-progress: false
jobs:
  inspect:
    if: >-
      github.repository == 'heavenskybird/stripunion' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/revenue-truth-20261115')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate revenue semantics offline
        run: node --test scripts/test/revenue-truth.test.mjs
      - name: Read two existing official sources without click, postback, settings or deployment writes
        env:
          STRIPCASH_STATS_API_TOKEN: ${{ secrets.STRIPCASH_STATS_API_TOKEN }}
          STRIPCASH_POSTBACK_SECRET: ${{ secrets.STRIPCASH_POSTBACK_SECRET }}
        run: node scripts/revenue-readonly-acceptance.mjs --live
      - name: Prove tracked state unchanged
        if: always()
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revenue-readonly-${{ github.run_id }}
          path: artifacts/revenue-readonly/
          retention-days: 14
