name: Editorial distribution

on:
  push:
    branches: [main]
    paths:
      - 'src/data/guides/*.js'

permissions:
  contents: write

jobs:
  distribute-new-guides:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover newly added guides
        id: guides
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
            before="$(git rev-list --max-parents=0 "$after")"
          fi
          files="$(git diff --diff-filter=A --name-only "$before" "$after" -- 'src/data/guides/*.js' || true)"
          {
            echo 'files<<EOF'
            echo "$files"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Wait for production and distribute
        if: steps.guides.outputs.files != ''
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID: ${{ vars.BUFFER_CHANNEL_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
          GUIDE_FILES: ${{ steps.guides.outputs.files }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            event="$(node scripts/guide-event.mjs "$file")"
            url="$(node -e 'const e=JSON.parse(process.argv[1]); process.stdout.write(e.url)' "$event")"

            live=0
            for attempt in {1..20}; do
              code="$(curl -L -sS -o /dev/null -w '%{http_code}' "$url" || true)"
              if [[ "$code" == "200" ]]; then
                live=1
                break
              fi
              sleep 15
            done

            if [[ "$live" != "1" ]]; then
              echo "Guide not live after wait window: $url" >&2
              exit 1
            fi

            SOCIAL_EVENT_JSON="$event" node ops/seo-data-layer/src/distribution/social-event.mjs
            SOCIAL_EVENT_JSON="$event" node ops/seo-data-layer/src/distribution/telegram.mjs
            node scripts/record-astro-publication.mjs "$file" distributed
          done <<< "$GUIDE_FILES"

      - name: Commit Astro publication ledger
        if: steps.guides.outputs.files != ''
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- ops/editorial/publication-ledger/astro)" ]]; then
            echo "No Astro ledger changes to commit."
            exit 0
          fi
          git config user.name "stripunion-growth-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ops/editorial/publication-ledger/astro
          git commit -m "report: record Astro editorial publications [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          echo "Failed to push Astro publication ledger after retries." >&2
          exit 1
