name: Visual QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/visual-regression.mjs'
      - 'package.json'
      - '.github/workflows/visual-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/visual-regression.mjs'
      - 'package.json'
      - '.github/workflows/visual-qa.yml'
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: visual-qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-regression:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build staging-safe site
        run: PUBLIC_ALLOW_INDEXING=false npm run build
      - name: Start local preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npx astro preview --host 0.0.0.0 --port 4321 > /tmp/stripunion-preview.log 2>&1 &
          for attempt in {1..45}; do
            if curl -fsS http://localhost:4321/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/stripunion-preview.log
          exit 1
      - name: Run responsive visual QA
        run: npm run test:visual
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-local
          path: artifacts/visual-qa
          if-no-files-found: warn
          retention-days: 14

  production-regression:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production visual QA
        env:
          VISUAL_BASE_URL: https://stripunion.com
          VISUAL_TARGETS_JSON: '["/","/guides/adult-affiliate-webmaster-program-evaluation-guide","/guides/premium-adult-video-subscription-value-privacy-guide","/guides/adult-site-payment-privacy-billing-guide","https://blog.stripunion.com/","https://avcams.online/"]'
          VISUAL_OUTPUT_DIR: artifacts/visual-qa-production
        run: npm run test:visual
      - name: Upload production visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa-production
          path: artifacts/visual-qa-production
          if-no-files-found: error
          retention-days: 14


  editorial-producer-watchdog:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure hourly producer is enabled and fresh
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Re-enable defensively in case GitHub marked the scheduled workflow inactive.
          gh workflow enable editorial-hourly-producer.yml || true

          runs="$(gh run list             --workflow editorial-hourly-producer.yml             --limit 20             --json databaseId,status,conclusion,createdAt,event,url)"

          decision="$(RUNS_JSON="$runs" node - <<'NODE'
          const runs = JSON.parse(process.env.RUNS_JSON || '[]');
          const now = Date.now();
          const active = runs.find((run) => ['queued', 'in_progress', 'waiting', 'requested', 'pending'].includes(run.status));
          if (active) {
            console.log(JSON.stringify({ action: 'skip-active', run: active }));
            process.exit(0);
          }

          const latest = runs
            .filter((run) => run.createdAt)
            .sort((a, b) => Date.parse(b.createdAt) - Date.parse(a.createdAt))[0] || null;

          if (!latest) {
            console.log(JSON.stringify({ action: 'dispatch', reason: 'no-prior-run' }));
            process.exit(0);
          }

          const ageMinutes = (now - Date.parse(latest.createdAt)) / 60000;
          if (ageMinutes > 75) {
            console.log(JSON.stringify({
              action: 'dispatch',
              reason: 'stale-latest-run',
              ageMinutes: Number(ageMinutes.toFixed(1)),
              latest
            }));
          } else {
            console.log(JSON.stringify({
              action: 'skip-fresh',
              ageMinutes: Number(ageMinutes.toFixed(1)),
              latest
            }));
          }
          NODE
          )"

          echo "EDITORIAL_PRODUCER_WATCHDOG $decision"

          action="$(node -e 'const d=JSON.parse(process.argv[1]); process.stdout.write(d.action)' "$decision")"
          if [[ "$action" == "dispatch" ]]; then
            gh workflow run editorial-hourly-producer.yml --ref main
            echo "Dispatched editorial-hourly-producer.yml because its scheduled run was missing or stale."
          fi
