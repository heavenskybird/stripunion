name: Recovery read-only evidence
on:
  push:
    branches: [codex/recovery-integration-20261111]
    paths:
      - .github/workflows/recovery-readonly-evidence.yml
      - scripts/recovery-readonly-evidence.mjs
permissions:
  contents: read
  actions: read
concurrency:
  group: recovery-readonly-evidence
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Observe without generation, publishing, sends or state writes
        env:
          GH_TOKEN: ${{ github.token }}
          SOCIAL_OUTBOX_SEND_ENABLED: ${{ vars.SOCIAL_OUTBOX_SEND_ENABLED || 'UNSET' }}
          SOCIAL_OUTBOX_SINGLE_WRITER_ENABLED: ${{ vars.SOCIAL_OUTBOX_SINGLE_WRITER_ENABLED || 'UNSET' }}
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          STRIPCASH_POSTBACK_SECRET: ${{ secrets.STRIPCASH_POSTBACK_SECRET }}
          LIVE_MODELS_WORKER_DEPLOY_ENABLED: ${{ vars.LIVE_MODELS_WORKER_DEPLOY_ENABLED || 'UNSET' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/recovery-readonly-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-readonly-${{ github.run_id }}
          path: work/recovery/readonly-evidence.json
          retention-days: 14
