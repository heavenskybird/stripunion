name: Recovery funded credential verification
on:
  push:
    branches: [codex/recovery-production-acceptance-20261112]
    paths: [.github/workflows/recovery-funded-credential.yml]
permissions:
  contents: read
concurrency:
  group: recovery-funded-credential-20261112
  cancel-in-progress: false
jobs:
  verify:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'test: verify funded production credential before R1 rearm'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: One bounded live request, no producer or receipt writes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDITORIAL_MODEL: ${{ vars.EDITORIAL_MODEL || 'gpt-6-luna' }}
        run: node scripts/openai-readiness-probe.mjs
      - name: Preserve sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funded-credential-${{ github.run_id }}
          path: work/recovery/openai-readiness.json
          retention-days: 14
