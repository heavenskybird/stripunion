name: Editorial hourly producer

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  actions: write

jobs:
  produce:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: editorial-hourly-producer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      EDITORIAL_BATCH_SIZE: '5'
      EDITORIAL_MODEL: ${{ vars.EDITORIAL_MODEL || 'gpt-6-luna' }}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh main after acquiring the single writer lock
        run: git pull --ff-only origin main

      - name: Admit one durable cadence cycle
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/editorial-r1-runtime.mjs admit

      - name: Install dependencies
        if: steps.admission.outputs.claimed == 'true'
        run: npm install

      - name: Verify producer credential
        if: steps.admission.outputs.claimed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "::error::OPENAI_API_KEY is not configured. Add it under Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

      - name: Reconcile publication state
        if: steps.admission.outputs.claimed == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/reconcile-editorial-backlog.mjs

      - name: Plan recovery-first batch
        if: steps.admission.outputs.claimed == 'true'
        id: recovery
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/stripunion-editorial-batch.json
          node scripts/editorial-r1-runtime.mjs restore
          if [[ ! -f /tmp/stripunion-editorial-batch.json ]]; then
            node scripts/plan-editorial-recovery.mjs
          fi
          if [[ -f /tmp/stripunion-editorial-batch.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan hourly batch and generate only the deficit
        if: steps.recovery.outputs.ready != 'true' && steps.admission.outputs.claimed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-editorial-batch.mjs

      - name: Load isolated five-item batch manifest
        if: steps.admission.outputs.claimed == 'true'
        id: batch
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/stripunion-editorial-batch.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/stripunion-editorial-batch.json', 'utf8'));
          if (data.count !== 5 || data.artifactFiles?.length !== 5 || data.guideFiles?.length !== 5) {
            throw new Error('Expected isolated five-item batch manifest.');
          }
          const out = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out, [
            'artifact_files<<EOF',
            ...data.artifactFiles,
            'EOF',
            'guide_files<<EOF',
            ...data.guideFiles,
            'EOF',
            'carryover_count=' + (data.carryoverCount || 0),
            'recovery_count=' + (data.recoveryCount || 0),
            'generated_count=' + (data.generatedCount || 0),
            'mode=' + (data.mode || 'production'),
            ''
          ].join('\n'));
          console.log(JSON.stringify({
            count: data.count,
            carryoverCount: data.carryoverCount || 0,
            recoveryCount: data.recoveryCount || 0,
            generatedCount: data.generatedCount || 0,
            mode: data.mode || 'production',
            categories: data.categories,
            backlogIds: data.backlogIds,
            skippedCarryover: data.skippedCarryover
          }, null, 2));
          NODE

      - name: Claim selected batch in control plane
        if: steps.admission.outputs.claimed == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run control-plane:claim

      - name: Validate backlog and only this hourly batch
        if: steps.admission.outputs.claimed == 'true'
        env:
          ARTIFACT_FILES: ${{ steps.batch.outputs.artifact_files }}
        shell: bash
        run: |
          set -euo pipefail
          npm run check:editorial-backlog
          mapfile -t files < <(printf '%s\n' "$ARTIFACT_FILES" | sed '/^$/d')
          [[ "${#files[@]}" == "5" ]]
          node scripts/compile-editorial-artifacts.mjs --check "${files[@]}"

      - name: Compile only this hourly batch
        if: steps.admission.outputs.claimed == 'true' && steps.batch.outputs.mode != 'recovery'
        env:
          ARTIFACT_FILES: ${{ steps.batch.outputs.artifact_files }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(printf '%s\n' "$ARTIFACT_FILES" | sed '/^$/d')
          [[ "${#files[@]}" == "5" ]]
          node scripts/compile-editorial-artifacts.mjs "${files[@]}"

      - name: Reconcile compiled state
        if: steps.admission.outputs.claimed == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/reconcile-editorial-backlog.mjs

      - name: Verify exactly five selected guide modules exist
        if: steps.admission.outputs.claimed == 'true'
        env:
          GUIDE_FILES: ${{ steps.batch.outputs.guide_files }}
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            test -f "$file"
            count=$((count + 1))
          done <<< "$GUIDE_FILES"
          if [[ "$count" != "5" ]]; then
            echo "Expected exactly 5 selected guide modules; found $count" >&2
            exit 1
          fi

      - name: Run production quality gates
        if: steps.admission.outputs.claimed == 'true'
        run: |
          node --check scripts/generate-editorial-batch.mjs
          node --check scripts/plan-editorial-recovery.mjs
          node --check scripts/reconcile-editorial-backlog.mjs
          node --check scripts/social-outbox-enqueue.mjs
          node --check scripts/check-live-publications.mjs
          node scripts/check-live-publications.mjs --self-test
          node --test scripts/test/reliability-r1.test.mjs
          npm run check
          PUBLIC_ALLOW_INDEXING=false npm run build
          node scripts/check-staging-robots-artifact.mjs
          PUBLIC_ALLOW_INDEXING=true PUBLIC_GA4_MEASUREMENT_ID=G-TEST123456 npm run build
          PUBLIC_ALLOW_INDEXING=true PUBLIC_GA4_MEASUREMENT_ID=G-TEST123456 npm run check:prod-seo
          PUBLIC_ALLOW_INDEXING=true PUBLIC_GA4_MEASUREMENT_ID=G-TEST123456 node scripts/check-ga4-artifact.mjs

      - name: Install Chromium for visual QA
        if: steps.admission.outputs.claimed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Start local production preview
        if: steps.admission.outputs.claimed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          nohup npx astro preview --host 0.0.0.0 --port 4321 > /tmp/stripunion-hourly-preview.log 2>&1 &
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:4321/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/stripunion-hourly-preview.log
          exit 1

      - name: Run visual QA on all five selected guides
        if: steps.admission.outputs.claimed == 'true'
        env:
          GUIDE_FILES: ${{ steps.batch.outputs.guide_files }}
        shell: bash
        run: |
          set -euo pipefail
          targets="$(node - <<'NODE'
          const files = String(process.env.GUIDE_FILES || '').split(/\r?\n/).filter(Boolean);
          const targets = files.map((file) => '/guides/' + file.split('/').pop().replace(/\.js$/, ''));
          process.stdout.write(JSON.stringify(targets));
          NODE
          )"
          VISUAL_BASE_URL=http://127.0.0.1:4321 \
          VISUAL_TARGETS_JSON="$targets" \
          VISUAL_OUTPUT_DIR=artifacts/visual-qa-hourly \
          npm run test:visual

      - name: Upload hourly visual evidence
        if: always() && steps.admission.outputs.claimed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: editorial-hourly-visual-qa
          path: artifacts/visual-qa-hourly
          if-no-files-found: warn
          retention-days: 14

      - name: Persist visual QA history to control plane
        if: always() && steps.admission.outputs.claimed == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VISUAL_REPORT_PATH: artifacts/visual-qa-hourly/visual-report.json
        run: npm run control-plane:visual

      - name: Checkpoint validated batch to control plane
        if: steps.admission.outputs.claimed == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTROL_PLANE_REQUIRED: 'false'
          CONTROL_PLANE_SOURCE: editorial-hourly-checkpoint
        run: npm run sync:growth-control-plane

      - name: Commit validated batch directly to canonical main
        if: steps.admission.outputs.claimed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "stripunion-content-factory"
          git config user.email "actions@users.noreply.github.com"
          node scripts/editorial-r1-runtime.mjs checkpoint
          git add ops/editorial/content-artifacts ops/editorial/hourly-backlog.json src/data/guides ops/editorial/pending-publication-batch.json

          if git diff --cached --quiet; then
            echo "No new content changes to commit; recovery batch is using existing canonical guides."
            exit 0
          fi

          git commit -m "content: publish autonomous hourly editorial batch [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done

          echo "Failed to push validated hourly editorial batch after retries." >&2
          exit 1

      - name: Wait for production and enqueue native social outbox
        if: steps.admission.outputs.claimed == 'true'
        env:
          GUIDE_FILES: ${{ steps.batch.outputs.guide_files }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t guide_files < <(printf '%s\n' "$GUIDE_FILES" | sed '/^[[:space:]]*$/d')
          if [[ "${#guide_files[@]}" -ne 5 ]]; then
            echo "Expected exactly five guide files before live verification; got ${#guide_files[@]}." >&2
            exit 1
          fi

          publication_urls_json="$(node - <<'NODE'
          const files = String(process.env.GUIDE_FILES || '').split(/\r?\n/).filter(Boolean);
          const urls = files.map((file) => {
            const slug = file.split('/').pop().replace(/\.js$/, '');
            return 'https://stripunion.com/guides/' + slug;
          });
          process.stdout.write(JSON.stringify(urls));
          NODE
          )"

          expected_guides_json="$(node --input-type=module - <<'NODE'
          import { guideFingerprints } from './scripts/publication-deployment.mjs';
          const files = String(process.env.GUIDE_FILES || '').split(/\r?\n/).filter(Boolean);
          process.stdout.write(JSON.stringify(await guideFingerprints(files)));
          NODE
          )"
          PUBLICATION_URLS_JSON="$publication_urls_json" \
          PUBLICATION_EXPECTED_GUIDES_JSON="$expected_guides_json" \
          node scripts/check-live-publications.mjs

          for file in "${guide_files[@]}"; do
            node scripts/record-astro-publication.mjs "$file" distribution_pending
            node scripts/social-outbox-enqueue.mjs "$file"
          done

      - name: Close publication state and persist ledger
        if: steps.admission.outputs.claimed == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/reconcile-editorial-backlog.mjs
          node scripts/editorial-r1-runtime.mjs clear
          git add ops/editorial/publication-ledger/astro ops/editorial/hourly-backlog.json ops/social-outbox/events ops/editorial/pending-publication-batch.json

          if git diff --cached --quiet; then
            echo "Publication state is already closed."
            exit 0
          fi

          git commit -m "report: close autonomous hourly editorial batch"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done

          echo "Failed to push publication ledger after retries." >&2
          exit 1

      - name: Dispatch Native Social Outbox
        if: steps.admission.outputs.claimed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api             --method POST             -H "Accept: application/vnd.github+json"             "/repos/${GITHUB_REPOSITORY}/actions/workflows/social-outbox.yml/dispatches"             -f ref=main
          echo "SOCIAL_OUTBOX_DISPATCH_REQUESTED"

      - name: Complete durable R1 cycle
        if: steps.admission.outputs.claimed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/editorial-r1-runtime.mjs finish success

      - name: Mirror canonical state to growth control plane
        if: steps.admission.outputs.claimed == 'true'
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONTROL_PLANE_REQUIRED: 'false'
          CONTROL_PLANE_SOURCE: editorial-hourly-producer
        run: npm run sync:growth-control-plane

      - name: Report rolling production
        if: steps.admission.outputs.claimed == 'true'
        run: npm run report:editorial-production

      - name: Record failed hourly run in control plane
        if: failure() && steps.admission.outputs.claimed == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEAD_LETTER_JOB_TYPE: editorial-hourly-producer
          DEAD_LETTER_REASON: Editorial hourly producer failed; inspect the linked GitHub Actions run and retry only after the root cause is understood.
          DEAD_LETTER_RETRYABLE: 'true'
        run: npm run control-plane:dead-letter

      - name: Record incomplete R1 cycle
        if: failure() && steps.admission.outputs.claimed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/editorial-r1-runtime.mjs finish failure

      - name: Upload bounded publication verification evidence
        if: always() && steps.admission.outputs.claimed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: publication-verification-${{ github.run_id }}
          path: artifacts/publication-verification
          if-no-files-found: ignore
          retention-days: 14
