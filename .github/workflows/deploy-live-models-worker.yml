name: Deploy live models worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - services/live-models-worker/**
      - .github/workflows/deploy-live-models-worker.yml

permissions:
  contents: read

jobs:
  deploy:
    if: vars.LIVE_MODELS_WORKER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/live-models-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Deploy Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: services/live-models-worker
          command: deploy
          secrets: |
            STRIPCASH_MODELS_API_KEY
            STRIPCASH_POSTBACK_SECRET
        env:
          STRIPCASH_MODELS_API_KEY: ${{ secrets.STRIPCASH_MODELS_API_KEY }}
          STRIPCASH_POSTBACK_SECRET: ${{ secrets.STRIPCASH_POSTBACK_SECRET }}

      - name: Smoke test deployed worker
        working-directory: .
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          STRIPCASH_POSTBACK_SECRET: ${{ secrets.STRIPCASH_POSTBACK_SECRET }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL:-https://stripunion-live-models.stripunion.workers.dev}"
          echo "Testing $base"

          health="$(curl --fail --silent --show-error --retry 4 --retry-delay 2 "$base/health")"
          node -e '
            const data = JSON.parse(process.argv[1]);
            if (data.ok !== true || data.service !== "stripunion-live-models") {
              throw new Error("Unexpected /health payload");
            }
            console.log("PASS worker health");
          ' "$health"

          for origin in https://stripunion.com https://staging.stripunion.com; do
            headers_file="$(mktemp)"
            models_file="$(mktemp)"
            models_status="$(curl --silent --show-error --retry 4 --retry-delay 2               -D "$headers_file" -o "$models_file" -w '%{http_code}'               -H "Origin: $origin"               "$base/models?limit=3")"
            models="$(cat "$models_file")"

            if [ "$models_status" != "200" ]; then
              echo "Models endpoint failed safely for $origin: HTTP $models_status"
              rm -f "$headers_file" "$models_file"
              exit 1
            fi

            expected_cors="access-control-allow-origin: $origin"
            if ! tr -d '\r' < "$headers_file" | grep -Fiq "$expected_cors"; then
              echo "Missing expected CORS header for $origin"
              rm -f "$headers_file" "$models_file"
              exit 1
            fi

            node -e '
              const data = JSON.parse(process.argv[1]);
              if (data.ok !== true || !Array.isArray(data.models)) {
                throw new Error("Unexpected /models payload");
              }
              if (data.models.length < 1 || data.models.length > 3) {
                throw new Error("Unexpected model count");
              }
              for (const model of data.models) {
                if (!model.id || !model.username || !model.snapshotUrl) {
                  throw new Error("Missing safe public model fields");
                }
                if ("geobans" in model || "clickUrl" in model) {
                  throw new Error("Private/restricted fields leaked to browser payload");
                }
              }
              console.log(`PASS models endpoint: ${data.models.length} eligible card(s), values withheld`);
            ' "$models"

            rm -f "$headers_file" "$models_file"
          done

          denied_status="$(curl --silent --output /dev/null --write-out '%{http_code}'             -H 'Origin: https://example.invalid'             "$base/models?limit=1")"
          if [ "$denied_status" != "403" ]; then
            echo "Unexpected CORS-origin status for unapproved origin: $denied_status"
            exit 1
          fi
          echo "PASS unapproved browser origin is denied"

          experiment_headers="$(mktemp)"
          experiment_body="$(mktemp)"
          experiment_status=""
          for attempt in 1 2 3 4 5 6; do
            : > "$experiment_headers"
            : > "$experiment_body"
            experiment_status="$(curl --silent --show-error \
              -D "$experiment_headers" -o "$experiment_body" -w '%{http_code}' \
              -X POST \
              -H 'Origin: https://staging.stripunion.com' \
              -H 'Content-Type: application/json' \
              --data '{"test":true,"experimentId":"cta-copy-ci","variant":"control","exposureId":"exp_ci_123"}' \
              "$base/events/experiment")"
            if [ "$experiment_status" = "202" ]; then
              break
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Experiment endpoint not propagated yet (HTTP $experiment_status, attempt $attempt/6); retrying."
              sleep "$((attempt * 2))"
            fi
          done
          experiment_payload="$(cat "$experiment_body")"
          if [ "$experiment_status" != "202" ]; then
            echo "Experiment ingestion smoke test failed after propagation retries: HTTP $experiment_status"
            cat "$experiment_body"
            rm -f "$experiment_headers" "$experiment_body"
            exit 1
          fi
          node -e '
            const data = JSON.parse(process.argv[1]);
            if (data.ok !== true || data.test !== true) throw new Error("Unexpected experiment-ingestion smoke response");
            console.log("PASS first-party experiment ingestion");
          ' "$experiment_payload"
          rm -f "$experiment_headers" "$experiment_body"

          click_headers="$(mktemp)"
          click_body="$(mktemp)"
          click_status="$(curl --silent --show-error             -D "$click_headers" -o "$click_body" -w '%{http_code}'             -X POST             -H 'Origin: https://staging.stripunion.com'             -H 'Content-Type: application/json'             --data '{"test":true,"memberId":"su_ci_12345678"}'             "$base/events/click")"
          click_payload="$(cat "$click_body")"
          if [ "$click_status" != "202" ]; then
            echo "Click ingestion smoke test failed: HTTP $click_status"
            rm -f "$click_headers" "$click_body"
            exit 1
          fi
          if ! tr -d '\r' < "$click_headers" | grep -Fiq 'access-control-allow-origin: https://staging.stripunion.com'; then
            echo "Click ingestion is missing staging CORS"
            rm -f "$click_headers" "$click_body"
            exit 1
          fi
          node -e '
            const data = JSON.parse(process.argv[1]);
            if (data.ok !== true || data.test !== true) throw new Error("Unexpected click-ingestion smoke response");
            console.log("PASS first-party click ingestion");
          ' "$click_payload"
          rm -f "$click_headers" "$click_body"

          if [ -z "$STRIPCASH_POSTBACK_SECRET" ]; then
            echo "STRIPCASH_POSTBACK_SECRET is missing"
            exit 1
          fi

          unauth_status="$(curl --silent --output /dev/null --write-out '%{http_code}'             "$base/postback/stripcash?test=1")"
          if [ "$unauth_status" != "401" ]; then
            echo "Unexpected unauthenticated postback status: $unauth_status"
            exit 1
          fi
          echo "PASS unauthenticated postback is rejected"

          postback_test="$(curl --fail --silent --show-error             "$base/postback/stripcash?token=$STRIPCASH_POSTBACK_SECRET&test=1&type=first_purchase&memberId=su_ci_12345678")"
          node -e '
            const data = JSON.parse(process.argv[1]);
            if (data.ok !== true || data.test !== true) throw new Error("Unexpected protected postback test response");
            console.log("PASS protected StripCash postback endpoint");
          ' "$postback_test"

          summary_test="$(curl --fail --silent --show-error             -H "X-StripUnion-Attribution-Token: $STRIPCASH_POSTBACK_SECRET"             "$base/analytics/summary")"
          node -e '
            const data = JSON.parse(process.argv[1]);
            if (data.ok !== true || !data.summary) throw new Error("Unexpected attribution summary response");
            console.log("PASS protected attribution summary endpoint");
          ' "$summary_test"

      - name: Show deployment URL
        working-directory: .
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "Live models worker deployed: $DEPLOYMENT_URL"
          else
            echo "Worker deployed; deployment URL was not returned by the action."
          fi
