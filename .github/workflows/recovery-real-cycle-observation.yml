name: Recovery real cycle observation
on:
  push:
    branches: [codex/recovery-r1-rearm-20261112]
    paths: [.github/workflows/recovery-real-cycle-observation.yml]
permissions:
  contents: read
  actions: write
concurrency:
  group: recovery-real-cycle-observation
  cancel-in-progress: false
jobs:
  observe:
    if: >-
      github.run_attempt == 1 && github.event.head_commit.message == 'ops: observe three natural production cycles and stop on failure'
    runs-on: ubuntu-latest
    timeout-minutes: 190
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Observe real business output; pause scheduler after real failure
        env:
          GH_TOKEN: ${{ github.token }}
          SOCIAL_OUTBOX_SEND_ENABLED: ${{ vars.SOCIAL_OUTBOX_SEND_ENABLED || 'UNSET' }}
        run: node scripts/recovery-observe-cycles.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-cycle-observation-${{ github.run_id }}
          path: work/recovery/cycle-observation.json
          retention-days: 14
