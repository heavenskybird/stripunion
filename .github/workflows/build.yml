name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Hostinger read-only checker
        run: |
          node --check scripts/hostinger-readonly-check.mjs
          node scripts/hostinger-readonly-check.mjs --self-test
          node --check scripts/staging-smoke-check.mjs
          node scripts/staging-smoke-check.mjs --self-test
          node --check scripts/blog-health-check.mjs
          node scripts/blog-health-check.mjs --self-test
          node --check ops/growth/collect-competitors.mjs
          node --check ops/growth/content-inventory.mjs
          node --check ops/growth/opportunities.mjs
          node scripts/content-quality-gate.mjs --self-test
          node ops/seo-data-layer/src/collectors/ga4-admin.mjs --self-test
          node --check ops/seo-data-layer/src/collectors/bing.mjs
          node --check ops/seo-data-layer/src/reports/weekly.mjs
          node ops/seo-data-layer/src/collectors/stripcash-schema-probe.mjs --self-test
          node ops/seo-data-layer/src/distribution/telegram.mjs --self-test
          node ops/seo-data-layer/src/distribution/telegram-evergreen.mjs --self-test
          node ops/seo-data-layer/src/collectors/stripcash-models-schema-probe.mjs --self-test
          node --check services/live-models-worker/src/index.js
          npm --prefix services/live-models-worker install --no-audit --no-fund
          npm --prefix services/live-models-worker test
          (cd services/live-models-worker && npx wrangler deploy --dry-run --outdir ../../.tmp-live-models-worker)
          node ops/seo-data-layer/src/collectors/stripcash.mjs --self-test
          npm --prefix ops/seo-data-layer test
          node --check scripts/two-site-main-health.mjs
          node --check scripts/check-ga4-artifact.mjs
          node --check scripts/check-bing-intelligence.mjs
          node scripts/check-bing-intelligence.mjs --self-test
          node --check scripts/public-health-oracle.mjs
          npm run check:editorial-backlog
          node --check scripts/compile-editorial-artifacts.mjs
          node --check scripts/generate-editorial-batch.mjs
          node --check scripts/reconcile-editorial-backlog.mjs
          node --check scripts/record-astro-publication.mjs
          npm run check:editorial-artifacts
          node --check scripts/editorial-production-count.mjs
          node --check scripts/visual-regression.mjs
          npm run report:editorial-production > /tmp/editorial-production.json
      - name: Run migration quality gate
        run: npm run check
      - name: Build staging-safe site
        run: |
          PUBLIC_ALLOW_INDEXING=false npm run build
          node scripts/check-staging-robots-artifact.mjs
      - name: Build production-indexable site
        run: PUBLIC_ALLOW_INDEXING=true PUBLIC_GA4_MEASUREMENT_ID=G-TEST123456 npm run build
      - name: Verify production SEO artifacts
        env:
          PUBLIC_ALLOW_INDEXING: 'true'
          PUBLIC_GA4_MEASUREMENT_ID: G-TEST123456
        run: |
          npm run check:prod-seo
          node scripts/check-ga4-artifact.mjs

